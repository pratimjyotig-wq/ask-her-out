
<!DOCTYPE html>

    <title>Will You Go Out With Me?</title>

    <link rel="stylesheet" href="style.css">

<body>

    <!-- FIRST SLIDE -->

        <h1>Do you wanna go out with me? 💕</h1>

    </div>


    <!-- SECOND SLIDE -->

        <h1>YAYYYY! 🥰❤️</h1>

        <div class="bear">🐻💐</div>

        <h2>I knew you would say yes! 💕</h2>

        <p>Let's go on a date! 🌹</p>

    </div>


    <script src="script.js"></script>

</body>
</html>
